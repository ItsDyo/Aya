[pytest]
markers =
    unit: logica pura e isolada
    integration: integracao real entre componentes ou subprocessos
    git: usa repositorio Git ou worktree real
    ui: inicializa ou testa componentes Gradio
    ollama: requer ou simula comportamento especifico do Ollama
    slow: teste comprovadamente demorado
    release_full: validacao completa do mecanismo de release
